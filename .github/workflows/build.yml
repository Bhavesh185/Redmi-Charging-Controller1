

name: Build Redmi Charging Controller

on:
  workflow_dispatch:
  push:
    paths:
      - 'RedmiChargingController-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Extract project
        run: unzip -q RedmiChargingController-source.zip

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("RedmiChargingController/app/build.gradle")
          s = p.read_text()
          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }""",
              1
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p RedmiChargingController assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-Charging-Controller-APK
          path: RedmiChargingController/app/build/outputs/apk/debug/app-debug.apk
